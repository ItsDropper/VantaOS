name: VantaOS build

on:
  push:
    branches:
      - master
      - work/kernel-reliability-2026-10-15
      - work/comprehensive-tests-docs-2026-10-15
      - work/modular-kbuild-layout-2026-10-15
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential nasm grub-pc-bin xorriso mtools dosfstools qemu-system-x86 gnu-efi ovmf gdisk

      - name: Verify modular source manifests
        run: |
          make list-sources
          test -f arch/x86_64/Makefile
          test -f kernel/boot/Makefile
          test -f mm/Makefile
          test -f drivers/Makefile
          test -f fs/Makefile

      - name: Build kernel, ISO, and FAT32 image with self-tests
        run: chmod +x build.sh && VANTAOS_SELF_TEST=1 ./build.sh

      - name: Verify build artifacts
        run: test -s kernel.bin && test -s VantaOS.iso && test -s vantaos.img

      - name: QEMU boot and regression tests at multiple memory sizes
        shell: bash
        run: |
          set -euo pipefail
          required_markers=(
            VANTAOS_BOOT_OK
            VANTAOS_BOOT_INFO_READY
            VANTAOS_APIC_LOCAL_OK
            VANTAOS_SMP_TOPOLOGY_OK
            VANTAOS_BOOT_INFO_ADAPTER_OK
            VANTAOS_PMM_BOOT_INFO_OK
            VANTAOS_PMM_ALLOCATOR_OK
            VANTAOS_HEAP_ALLOCATOR_OK
            VANTAOS_USER_MAPPING_OK
            VANTAOS_PROCESS_API_GUARDS_OK
            VANTAOS_PROCESS_NAME_OK
            VANTAOS_PROCESS_STATE_TRANSITIONS_OK
            VANTAOS_FILESYSTEM_NAMESPACE_OK
            VANTAOS_VFS_HANDLE_GUARDS_OK
            VANTAOS_SCHEDULER_PROBE_OK
            VANTAOS_SCHEDULER_REAP_OK
          )

          for memory in 256 512; do
            log="boot-${memory}m.log"
            echo "Booting VantaOS in QEMU with ${memory} MiB RAM..."
            set +e
            timeout 12s qemu-system-x86_64 \
              -machine pc \
              -m "${memory}M" \
              -drive file=VantaOS.iso,media=cdrom,format=raw \
              -drive file=vantaos.img,if=ide,format=raw \
              -boot order=d \
              -display none \
              -serial "file:${log}" \
              -monitor none \
              -no-reboot
            result=$?
            set -e

            if [ "$result" -ne 124 ]; then
              echo "QEMU exited before the smoke-test timeout (exit code $result)."
              cat "$log" 2>/dev/null || true
              exit 1
            fi

            # Allow QEMU's serial file to flush after timeout sends SIGTERM.
            sleep 1

            if grep -Eq '^VANTAOS_[A-Z0-9_]*_FAIL' "$log"; then
              echo "A kernel self-test emitted a failure marker at ${memory} MiB."
              cat "$log"
              exit 1
            fi

            for marker in "${required_markers[@]}"; do
              if ! grep -q "^${marker}" "$log"; then
                echo "Missing required marker '${marker}' at ${memory} MiB."
                cat "$log" 2>/dev/null || true
                exit 1
              fi
            done
            echo "All required markers passed at ${memory} MiB."
          done

      - name: Build the UEFI boot manager and EFI system image
        run: make uefi

      - name: UEFI/OVMF boot and kernel handoff regression test
        shell: bash
        run: |
          set -euo pipefail
          code_firmware=""
          vars_template=""
          for suffix in "" "_4M"; do
            code_candidate="/usr/share/OVMF/OVMF_CODE${suffix}.fd"
            vars_candidate="/usr/share/OVMF/OVMF_VARS${suffix}.fd"
            if [ -s "$code_candidate" ] && [ -s "$vars_candidate" ]; then
              code_firmware="$code_candidate"
              vars_template="$vars_candidate"
              break
            fi
          done
          if [ -z "$code_firmware" ]; then
            code_firmware="$(find /usr/share -maxdepth 4 -name 'OVMF_CODE*.fd' -print -quit)"
            vars_template="${code_firmware/OVMF_CODE/OVMF_VARS}"
          fi
          test -n "$code_firmware" && test -s "$code_firmware"
          test -n "$vars_template" && test -s "$vars_template"
          echo "Using OVMF firmware: $code_firmware"
          test -s VantaOS-UEFI.img
          cp "$vars_template" OVMF_VARS.fd

          log=uefi-boot.log
          set +e
          timeout 20s qemu-system-x86_64 \
            -machine pc \
            -m 512M \
            -drive if=pflash,format=raw,readonly=on,file="$code_firmware" \
            -drive if=pflash,format=raw,file=OVMF_VARS.fd \
            -drive file=VantaOS-UEFI.img,format=raw,if=ide,index=0 \
            -drive file=vantaos.img,format=raw,if=ide,index=1 \
            -display none \
            -serial "file:$log" \
            -monitor none \
            -no-reboot
          result=$?
          set -e

          if [ "$result" -ne 124 ]; then
            echo "UEFI QEMU exited before the smoke-test timeout (exit code $result)."
            cat "$log" 2>/dev/null || true
            exit 1
          fi

          sleep 1
          if grep -Eq '^VANTAOS_[A-Z0-9_]*_FAIL' "$log"; then
            echo "A UEFI/kernel self-test emitted a failure marker."
            cat "$log"
            exit 1
          fi

          required_uefi_markers=(
            VANTAOS_UEFI_LOADER_START
            VANTAOS_UEFI_ELF_LOADED
            VANTAOS_UEFI_EXIT_BOOT_SERVICES_OK
            VANTAOS_UEFI_KERNEL_HANDOFF
            VANTAOS_UEFI_KERNEL_ENTRY
            VANTAOS_UEFI_BOOT_INFO_READY
            VANTAOS_APIC_LOCAL_OK
            VANTAOS_SMP_TOPOLOGY_OK
            VANTAOS_PMM_BOOT_INFO_OK
            VANTAOS_BOOT_OK
          )
          for marker in "${required_uefi_markers[@]}"; do
            if ! grep -q "^${marker}" "$log"; then
              echo "Missing required UEFI marker '${marker}'."
              cat "$log" 2>/dev/null || true
              exit 1
            fi
          done
          echo "UEFI loader reached the VantaOS kernel under OVMF."
