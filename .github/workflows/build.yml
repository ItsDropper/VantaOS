name: VantaOS build

on:
  push:
    branches:
      - main
      - work/kernel-reliability-2026-10-15
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential nasm grub-pc-bin xorriso mtools dosfstools qemu-system-x86
      - name: Build kernel, ISO, and FAT32 image
        run: chmod +x build.sh && ./build.sh
      - name: Verify build artifacts
        run: test -s kernel.bin && test -s VantaOS.iso && test -s vantaos.img

      - name: QEMU survival smoke test
        shell: bash
        run: |
          set +e
          timeout 8s qemu-system-x86_64 \
            -machine pc \
            -m 256M \
            -drive file=VantaOS.iso,media=cdrom,format=raw \
            -drive file=vantaos.img,if=ide,format=raw \
            -boot order=d \
            -display none \
            -serial none \
            -monitor none \
            -no-reboot
          result=$?
          if [ "$result" -ne 124 ]; then
            echo "QEMU exited before the smoke-test timeout (exit code $result)."
            exit 1
          fi
          echo "QEMU stayed alive for the full smoke-test window; visual boot is not yet asserted."
