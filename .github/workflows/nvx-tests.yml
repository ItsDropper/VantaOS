  pull_request:
    paths:
      - "drivers/gpu/nvx/**"
      - "include/nvx_gsp_boot_memory.h"
      - "include/nvx_gsp_secure_boot.h"
      - "include/nvx_gsp_pci_rom.h"
      - "include/nvx_gsp_fwsec_interface.h"
      - "include/nvx_gsp_fwsec_stage.h"
      - "include/nvx_gsp_fwsec_command.h"
      - "include/nvx_gsp_fwsec_result.h"
      - "include/nvx_gsp_fwsec_mmio.h"
      - "scripts/test_nvx_gsp_fwsec_mmio.c"
      - "scripts/test_nvx_gsp_boot_memory.c"
      - "scripts/test_nvx_gsp_secure_boot.c"
      - "scripts/test_nvx_gsp_vbios.c"
      - "scripts/test_nvx_gsp_pci_rom.c"
      - "scripts/test_nvx_gsp_fwsec_interface.c"
      - "scripts/test_nvx_gsp_fwsec_command.c"
      - "scripts/test_nvx_gsp_fwsec_result.c"
      - "drivers/gpu/core/**"
      - "include/gpu_pci_resources.h"
      - "include/gpu_mmio.h"
      - "scripts/test_gpu_mmio.c"
      - "include/gpu_pci_mmio.h"
      - "scripts/test_gpu_pci_mmio.c"
      - "include/gpu_irq.h"
      - "scripts/test_gpu_irq.c"
      - "include/gpu_va.h"
      - "scripts/test_gpu_va.c"
      - "include/gpu_vm.h"
      - "scripts/test_gpu_vm.c"
      - "include/gpu_registers.h"
      - "scripts/test_gpu_registers.c"
      - "include/gpu_engine.h"
      - "scripts/test_gpu_engine.c"
      - "include/gpu_bringup.h"
      - "include/gpu_dma.h"
      - "scripts/test_gpu_dma.c"
      - "include/gpu_dma_sync.h"
      - "scripts/test_gpu_dma_sync.c"
      - "include/gpu_engine_runtime.h"
      - "scripts/test_gpu_engine_runtime.c"
      - "scripts/test_gpu_bringup.c"
      - "scripts/test_gpu_pci_resources.c"
      - "drivers/gpu/intel/**"
      - "drivers/gpu/amd/**"
      - "include/intel_gen9.h"
      - "include/amd_polaris.h"
      - "scripts/test_gpu_gen_profiles.c"
      - "include/gpu.h"
      - "include/gpu_core.h"
      - "include/gpu_vendor.h"
      - "include/intel_gpu.h"
      - "include/amd_gpu.h"
      - "scripts/test_gpu_vendor_framework.c"
      - "drivers/pci/**"
      - "arch/x86_64/device_irq.c"
      - "arch/x86_64/isr.asm"
      - "include/device_irq.h"
      - "scripts/test_device_irq.c"
      - "include/nvx_device.h"
      - "include/nvx_lifecycle.h"
      - "include/nvx_resource.h"
      - "include/nvx_probe.h"
      - "include/nvx_mmio.h"
      - "include/nvx_attach.h"
      - "include/nvx_firmware.h"
      - "include/nvx_gsp_bundle.h"
      - "include/nvx_gsp_image.h"
      - "include/nvx_gsp_ring.h"
      - "include/nvx_gsp_msgq.h"
      - "include/nvx_gsp_msgq_queue.h"
      - "include/nvx_gsp_msgq_ga10x.h"
      - "include/nvx_gsp_gmcapi.h"
      - "scripts/test_nvx_gsp_static_info.c"
      - "scripts/test_nvx_gsp_gpfifo.c"
      - "scripts/test_nvx_gsp_ce.c"
      - "include/nvx_gsp_ce.h"
      - "include/nvx_gsp_gpfifo.h"
      - "scripts/test_nvx_gsp_rmapi.c"
      - "include/nvx_gsp_static_info.h"
      - "include/nvx_gsp_rmapi.h"
      - "scripts/test_nvx_gsp_system_info.c"
      - "include/nvx_gsp_system_info.h"
      - "scripts/test_nvx_gsp_nvkv.c"
      - "include/nvx_gsp_nvkv.h"
      - "include/nvx_gsp_startup.h"
      - "include/nvx_gsp_msgq_rpc.h"
      - "include/nvx_gsp_init_args.h"
      - "include/nvx_gsp_ga10x.h"
      - "include/nvx_gsp_falcon.h"
      - "drivers/gpu/nvx/gsp/nvx_gsp_falcon.c"
      - "drivers/gpu/nvx/gsp/nvx_gsp_msgq_ga10x.c"
      - "drivers/gpu/nvx/gsp/nvx_gsp_gmcapi.c"
      - "drivers/gpu/nvx/gsp/nvx_gsp_startup.c"
      - "scripts/test_nvx_gsp_falcon.c"
      - "include/nvx_gsp_bootloader.h"
      - "include/nvx_gsp_rpc.h"
      - "include/nvx_gsp_elf.h"
      - "include/nvx_gsp_preflight.h"
      - "include/nvx_gsp_wpr_meta.h"
      - "include/nvx_dma.h"
      - "include/dma.h"
      - "include/pmm.h"
      - "include/heap.h"
      - "mm/dma.c"
      - "mm/pmm.c"
      - "kernel/selftest/boot_info_selftest.c"
      - "scripts/test_pmm_contiguous.c"
      - "include/nvx_dma_sync.h"
      - "include/nvx_gpuva.h"
      - "include/nvx_gpuvm.h"
      - "include/nvx_object_memory.h"
      - "include/nvx_sync.h"
      - "include/nvx_submit.h"
      - "include/nvx_irq_caps.h"
      - "include/nvx_irq_route.h"
      - "include/pci.h"
      - "include/mmio.h"
      - "include/serial.h"
      - "scripts/test_nvx_device.c"
      - "scripts/test_nvx_pci.c"
      - "scripts/test_nvx_lifecycle.c"
      - "scripts/test_nvx_resource.c"
      - "scripts/test_nvx_probe.c"
      - "scripts/test_nvx_mmio.c"
      - "scripts/test_nvx_attach.c"
      - "scripts/test_nvx_firmware.c"
      - "scripts/test_nvx_gsp_bundle.c"
      - "scripts/test_nvx_gsp_image.c"
      - "scripts/test_nvx_gsp_ring.c"
      - "scripts/test_nvx_gsp_msgq.c"
      - "scripts/test_nvx_gsp_msgq_queue.c"
      - "scripts/test_nvx_gsp_msgq_ga10x.c"
      - "scripts/test_nvx_gsp_msgq_rpc.c"
      - "scripts/test_nvx_gsp_init_args.c"
      - "scripts/test_nvx_gsp_msgq_rpc_concurrency.c"
      - "scripts/test_nvx_gsp_ga10x.c"
      - "scripts/test_nvx_gsp_falcon.c"
      - "drivers/gpu/nvx/firmware/nvx_gsp_bootloader.c"
      - "scripts/test_nvx_gsp_rpc.c"
      - "scripts/test_nvx_gsp_rpc_msgq.c"
      - "scripts/test_nvx_gsp_elf.c"
      - "scripts/test_nvx_gsp_elf_sections.c"
      - "scripts/test_nvx_gsp_preflight.c"
      - "scripts/test_nvx_gsp_wpr_meta.c"
      - "scripts/test_nvx_dma.c"
      - "scripts/test_nvx_dma_sync.c"
      - "scripts/test_nvx_gpuva.c"
      - "scripts/test_nvx_gpuvm.c"
      - "scripts/test_nvx_object_memory.c"
      - "scripts/test_nvx_sync.c"
      - "scripts/test_nvx_submit.c"
      - "scripts/test_nvx_irq_caps.c"
      - "scripts/test_nvx_irq_route.c"
      - "scripts/test_pci_bar_size.c"
      - ".github/workflows/nvx-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nvx-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile generic GPU and Intel/AMD vendor framework tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_gpu_vendor_framework.c drivers/gpu/core/gpu_vendor.c \
            drivers/gpu/core/gpu_core.c drivers/gpu/core/gpu_pci_resources.c \
            drivers/gpu/intel/intel_gpu.c drivers/gpu/amd/amd_gpu.c -o /tmp/vantaos-gpu-vendor-framework-test

      - name: Test GPU classification, lifecycle and fail-closed capabilities
        run: /tmp/vantaos-gpu-vendor-framework-test

      - name: Compile generation-specific Intel Gen9 and AMD Polaris profile tests
        run: gcc -std=c11 -Wall -Wextra -Werror -Iinclude scripts/test_gpu_gen_profiles.c drivers/gpu/intel/intel_gen9.c drivers/gpu/amd/amd_polaris.c drivers/gpu/core/gpu_pci_resources.c -o /tmp/vantaos-gpu-gen-profiles-test

      - name: Test exact PCI allowlists, BAR preflight and fail-closed capability state
        run: /tmp/vantaos-gpu-gen-profiles-test

      - name: Compile shared GPU MMIO access tests with strict warnings
        run: gcc -std=c11 -Wall -Wextra -Werror -Iinclude scripts/test_gpu_mmio.c drivers/gpu/core/gpu_mmio.c -o /tmp/vantaos-gpu-mmio-test

      - name: Test shared GPU MMIO bounds, alignment, reads and writes
        run: /tmp/vantaos-gpu-mmio-test

      - name: Compile transactional PCI BAR MMIO mapping tests
        run: gcc -std=c11 -Wall -Wextra -Werror -Iinclude scripts/test_gpu_pci_mmio.c drivers/gpu/core/gpu_pci_mmio.c drivers/gpu/core/gpu_pci_resources.c drivers/gpu/core/gpu_mmio.c -o /tmp/vantaos-gpu-pci-mmio-test

      - name: Test PCI decode rollback, bus-master refusal, BAR bounds and exact unmap
        run: /tmp/vantaos-gpu-pci-mmio-test

      - name: Compile bounded GPU register transaction tests
        run: gcc -std=c11 -Wall -Wextra -Werror -Iinclude scripts/test_gpu_registers.c drivers/gpu/core/gpu_registers.c drivers/gpu/core/gpu_mmio.c -o /tmp/vantaos-gpu-registers-test

      - name: Test GPU register fields, polling and verified sequences
        run: /tmp/vantaos-gpu-registers-test

      - name: Compile generic GPU command ring and fence tests
        run: gcc -std=c11 -Wall -Wextra -Werror -Iinclude scripts/test_gpu_engine.c drivers/gpu/core/gpu_engine.c -o /tmp/vantaos-gpu-engine-test

      - name: Test GPU ring reservation, atomic packet publication, wraparound and fences
        run: /tmp/vantaos-gpu-engine-test

      - name: Compile staged GPU bring-up and rollback tests
        run: gcc -std=c11 -Wall -Wextra -Werror -Iinclude scripts/test_gpu_bringup.c drivers/gpu/core/gpu_bringup.c -o /tmp/vantaos-gpu-bringup-test

      - name: Test verified stage gates, reverse rollback and capability revocation
        run: /tmp/vantaos-gpu-bringup-test

      - name: Compile GPU PCI BAR inventory tests with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_gpu_pci_resources.c drivers/gpu/core/gpu_pci_resources.c \
            -o /tmp/vantaos-gpu-pci-resources-test

      - name: Test GPU BAR inventory, 64-bit pairing and malformed BAR rejection
        run: /tmp/vantaos-gpu-pci-resources-test

      - name: Compile PMM contiguous-run tests with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_pmm_contiguous.c mm/pmm.c \
            -o /tmp/vantaos-pmm-contiguous-test

      - name: Test contiguous PMM runs across fragmentation and rollback
        run: /tmp/vantaos-pmm-contiguous-test

      - name: Compile host-tested PCI BAR sizing with strict warnings
        run: |
          gcc -DPCI_TEST -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_pci_bar_size.c drivers/pci/pci.c \
            -o /tmp/vantaos-pci-bar-size-test

      - name: Test PCI BAR size masks, restoration, and active-device refusal
        run: /tmp/vantaos-pci-bar-size-test

      - name: Compile bounded NVKV encoder tests with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_gsp_nvkv.c drivers/gpu/nvx/gsp/nvx_gsp_nvkv.c \
            -o /tmp/vantaos-nvx-gsp-nvkv-test

      - name: Test NVKV instruction encoding, arrays, bounds, and malformed streams
        run: /tmp/vantaos-nvx-gsp-nvkv-test

      - name: Compile GSP RMAPI request tests with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_gsp_rmapi.c drivers/gpu/nvx/gsp/nvx_gsp_rmapi.c \
            -o /tmp/vantaos-nvx-gsp-rmapi-test

      - name: Test GSP RM allocation, control, free payloads and status decoding
        run: /tmp/vantaos-nvx-gsp-rmapi-test

      - name: Compile GSP static-info decoder tests with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_gsp_static_info.c \
            drivers/gpu/nvx/gsp/nvx_gsp_static_info.c \
            drivers/gpu/nvx/gsp/nvx_gsp_nvkv.c \
            -o /tmp/vantaos-nvx-gsp-static-info-test

      - name: Test decoded RM configuration, framebuffer regions and malformed indices
        run: /tmp/vantaos-nvx-gsp-static-info-test

      - name: Compile PCI-backed GSP system-info tests with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_gsp_system_info.c \
            drivers/gpu/nvx/gsp/nvx_gsp_system_info.c \
            drivers/gpu/nvx/gsp/nvx_gsp_nvkv.c \
            -o /tmp/vantaos-nvx-gsp-system-info-test

      - name: Test PCI-derived identity and explicit platform facts
        run: /tmp/vantaos-nvx-gsp-system-info-test

      - name: Compile GPFIFO submit tests with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_gsp_gpfifo.c \
            drivers/gpu/nvx/execution/nvx_gsp_gpfifo.c \
            drivers/gpu/nvx/execution/nvx_gsp_ce.c \
            -o /tmp/vantaos-nvx-gsp-gpfifo-test

      - name: Test GPFIFO address encoding, ring bounds, and completion polling
        run: /tmp/vantaos-nvx-gsp-gpfifo-test

      - name: Compile Ampere CE command-builder tests with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_gsp_ce.c drivers/gpu/nvx/execution/nvx_gsp_ce.c \
            -o /tmp/vantaos-nvx-gsp-ce-test

      - name: Test copy-engine methods, semaphore release, and GPUVA bounds
        run: /tmp/vantaos-nvx-gsp-ce-test

      - name: Compile GSP startup orchestration with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude -c \
            drivers/gpu/nvx/gsp/nvx_gsp_startup.c -o /tmp/vantaos-nvx-gsp-startup.o
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude -c \
            drivers/gpu/nvx/gsp/nvx_gsp_gmcapi.c -o /tmp/vantaos-nvx-gsp-gmcapi.o
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude -c \
            drivers/gpu/nvx/gsp/nvx_gsp_startup_pci.c -o /tmp/vantaos-nvx-gsp-startup-pci.o

      - name: Compile NVX identity tests with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_device.c drivers/gpu/nvx/core/nvx_device.c \
            drivers/gpu/nvx/core/nvx_generation.c -o /tmp/vantaos-nvx-device-test

      - name: Test NVIDIA PCI matching and descriptor invariants
        run: /tmp/vantaos-nvx-device-test

      - name: Compile NVX PCI inventory tests with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_pci.c drivers/gpu/nvx/core/nvx_device.c \
            drivers/gpu/nvx/core/nvx_generation.c drivers/gpu/nvx/core/nvx_pci.c \
            -o /tmp/vantaos-nvx-pci-test

      - name: Test PCI inventory diagnostics and auxiliary-function filtering
        run: /tmp/vantaos-nvx-pci-test

      - name: Compile NVX BAR resource tests with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_resource.c drivers/gpu/nvx/core/nvx_resource.c \
            -o /tmp/vantaos-nvx-resource-test

      - name: Test BAR validation, mapping refusal, mapping and cleanup
        run: /tmp/vantaos-nvx-resource-test

      - name: Compile NVIDIA BAR0 register probe tests with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_probe.c drivers/gpu/nvx/core/nvx_probe.c \
            drivers/gpu/nvx/core/nvx_mmio.c drivers/gpu/nvx/core/nvx_device.c \
            drivers/gpu/nvx/core/nvx_generation.c -o /tmp/vantaos-nvx-probe-test

      - name: Test conservative NVIDIA PMC register probing
        run: /tmp/vantaos-nvx-probe-test

      - name: Compile NVX MMIO access tests with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_mmio.c drivers/gpu/nvx/core/nvx_mmio.c \
            -o /tmp/vantaos-nvx-mmio-test

      - name: Test MMIO bounds, alignment, reads and writes
        run: /tmp/vantaos-nvx-mmio-test

      - name: Compile NVX attach transaction tests with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_attach.c drivers/gpu/nvx/core/nvx_attach.c \
            drivers/gpu/nvx/core/nvx_resource.c drivers/gpu/nvx/core/nvx_probe.c \
            drivers/gpu/nvx/core/nvx_mmio.c drivers/gpu/nvx/core/nvx_device.c \
            drivers/gpu/nvx/core/nvx_generation.c drivers/gpu/nvx/core/nvx_lifecycle.c \
            -o /tmp/vantaos-nvx-attach-test

      - name: Test NVX attach, register probe, rollback and teardown
        run: /tmp/vantaos-nvx-attach-test

      - name: Compile NVX firmware verification tests with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_firmware.c drivers/gpu/nvx/firmware/nvx_firmware.c \
            -o /tmp/vantaos-nvx-firmware-test

      - name: Test bounded GSP firmware acquisition and verification
        run: /tmp/vantaos-nvx-firmware-test

      - name: Compile NVX GSP firmware bundle tests with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_gsp_bundle.c drivers/gpu/nvx/firmware/nvx_gsp_bundle.c \
            drivers/gpu/nvx/core/nvx_generation.c -o /tmp/vantaos-nvx-gsp-bundle-test

      - name: Test GSP component paths, verification and transactional cleanup
        run: /tmp/vantaos-nvx-gsp-bundle-test

      - name: Compile bounded GSP booter-image parser tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_gsp_image.c drivers/gpu/nvx/firmware/nvx_gsp_image.c \
            -o /tmp/vantaos-nvx-gsp-image-test

      - name: Test GSP image offsets, signature ranges and app metadata
        run: /tmp/vantaos-nvx-gsp-image-test

      - name: Compile NVX DMA buffer tests with strict warnings
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_dma.c drivers/gpu/nvx/memory/nvx_dma.c \
            drivers/gpu/core/gpu_dma.c -o /tmp/vantaos-nvx-dma-test

      - name: Test contiguous DMA allocation bounds, validation and cleanup
        run: /tmp/vantaos-nvx-dma-test

      - name: Compile shared GPU DMA allocator tests
        run: gcc -std=c11 -Wall -Wextra -Werror -Iinclude scripts/test_gpu_dma.c drivers/gpu/core/gpu_dma.c -o /tmp/vantaos-gpu-dma-test

      - name: Test shared GPU DMA allocation, contiguity, bounds and cleanup
        run: /tmp/vantaos-gpu-dma-test

      - name: Compile shared GPU DMA ownership and ordering tests
        run: gcc -std=c11 -Wall -Wextra -Werror -Iinclude scripts/test_gpu_dma_sync.c drivers/gpu/core/gpu_dma_sync.c drivers/gpu/core/gpu_dma.c -o /tmp/vantaos-gpu-dma-sync-test

      - name: Test GPU DMA ownership transitions, range checks and stale handles
        run: /tmp/vantaos-gpu-dma-sync-test

      - name: Compile integrated GPU DMA ring runtime tests
        run: gcc -std=c11 -Wall -Wextra -Werror -Iinclude scripts/test_gpu_engine_runtime.c drivers/gpu/core/gpu_engine_runtime.c drivers/gpu/core/gpu_engine.c drivers/gpu/core/gpu_dma_sync.c drivers/gpu/core/gpu_dma.c -o /tmp/vantaos-gpu-engine-runtime-test

      - name: Test DMA-backed ring submission, fences, quiesce and teardown
        run: /tmp/vantaos-gpu-engine-runtime-test

      - name: Compile GPU interrupt event queue tests
        run: gcc -std=c11 -Wall -Wextra -Werror -Iinclude scripts/test_gpu_irq.c drivers/gpu/core/gpu_irq.c -o /tmp/vantaos-gpu-irq-test

      - name: Test IRQ queue back-pressure, ordering, device loss and deferred dispatch
        run: /tmp/vantaos-gpu-irq-test

      - name: Compile WPR metadata layout tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_gsp_wpr_meta.c drivers/gpu/nvx/firmware/nvx_gsp_wpr_meta.c \
            -o /tmp/vantaos-nvx-wpr-meta-test

      - name: Test exact 256-byte WPR V1 layout and range validation
        run: /tmp/vantaos-nvx-wpr-meta-test

      - name: Compile GA10x boot-memory ownership tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_nvx_gsp_boot_memory.c drivers/gpu/nvx/gsp/nvx_gsp_boot_memory.c \
            drivers/gpu/nvx/firmware/nvx_gsp_wpr_meta.c drivers/gpu/nvx/memory/nvx_dma_sync.c -o /tmp/vantaos-nvx-gsp-boot-memory-test

      - name: Test DMA artifact acquisition, WPR metadata handoff and rollback
        run: /tmp/vantaos-nvx-gsp-boot-memory-test

      - name: Compile GA10x SEC2 secure-booter execution tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -DNVX_GSP_RPC_TEST -Iinclude \
            scripts/test_nvx_gsp_secure_boot.c drivers/gpu/nvx/firmware/nvx_gsp_secure_boot.c \
            drivers/gpu/nvx/gsp/nvx_gsp_falcon.c drivers/gpu/nvx/core/nvx_mmio.c \
            drivers/gpu/nvx/memory/nvx_dma_sync.c \
            drivers/gpu/nvx/firmware/nvx_gsp_fwsec_result.c \
            drivers/gpu/nvx/firmware/nvx_gsp_fwsec_mmio.c \
            drivers/gpu/nvx/firmware/nvx_gsp_fwsec_interface.c \
            drivers/gpu/nvx/firmware/nvx_gsp_fwsec_command.c \
            drivers/gpu/nvx/firmware/nvx_gsp_fwsec_stage.c \
            drivers/gpu/nvx/firmware/nvx_gsp_vbios.c \
            drivers/gpu/nvx/gsp/nvx_gsp_init_args.c \
            drivers/gpu/nvx/gsp/nvx_gsp_msgq.c \
            drivers/gpu/nvx/gsp/nvx_gsp_msgq_queue.c \
            drivers/gpu/nvx/gsp/nvx_gsp_msgq_ga10x.c \
            drivers/gpu/nvx/gsp/nvx_gsp_gmcapi.c \
            drivers/gpu/nvx/gsp/nvx_gsp_nvkv.c \
            drivers/gpu/nvx/gsp/nvx_gsp_startup.c \
