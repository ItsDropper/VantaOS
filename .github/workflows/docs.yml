name: Documentation

on:
  push:
    branches: [master]
    paths: ['docs/**', '*.md', 'scripts/check_doc_links.py', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', '*.md', 'scripts/check_doc_links.py', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative Markdown links and anchors
        run: python3 scripts/check_doc_links.py
