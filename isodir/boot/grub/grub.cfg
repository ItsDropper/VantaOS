set timeout=5
set timeout_style=menu
insmod keystatus
if keystatus --shift; then
    # Holding Shift while the BIOS/GRUB boot menu starts selects recovery.
    set default=1
else
    set default=0
fi

insmod all_video

set gfxmode=1024x768x32
set gfxpayload=keep
terminal_output gfxterm

menuentry "VantaOS" {
    multiboot /boot/kernel.bin
    boot
}

menuentry "VantaOS Recovery Environment" {
    multiboot /boot/kernel.bin recovery=1
    boot
}
