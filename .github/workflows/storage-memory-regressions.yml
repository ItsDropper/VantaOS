name: VantaOS storage and memory host regressions

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install --yes build-essential
      - name: Test FAT32 long-filename parser
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude -Ifs \
            scripts/test_fat32_lfn_host.c fs/fat32_lfn.c \
            -o /tmp/vantaos-fat32-lfn-test
          /tmp/vantaos-fat32-lfn-test
      - name: Test partition scanner boundaries
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_partition_scan.c drivers/storage/partition_scan.c \
            -o /tmp/vantaos-partition-scan-test
          /tmp/vantaos-partition-scan-test
      - name: Test panic formatting boundaries
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -Iinclude \
            scripts/test_panic_format.c -o /tmp/vantaos-panic-format-test
          /tmp/vantaos-panic-format-test
