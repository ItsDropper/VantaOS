name: USB Bluetooth descriptor tests

on:
  push:
    branches: [master, 'work/**']
    paths:
      - 'drivers/usb/bluetooth.c'
      - 'drivers/usb/usb.c'
      - 'drivers/usb/Makefile'
      - 'docs/USB_BLUETOOTH_BRINGUP.md'
      - 'docs/DRIVER_COMPATIBILITY.md'
      - 'include/usb_bluetooth.h'
      - 'scripts/test_usb_bluetooth_descriptors.c'
      - '.github/workflows/usb-bluetooth-descriptors.yml'
  pull_request:
    paths:
      - 'drivers/usb/bluetooth.c'
      - 'include/usb_bluetooth.h'
      - 'scripts/test_usb_bluetooth_descriptors.c'
      - '.github/workflows/usb-bluetooth-descriptors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descriptor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile descriptor tests with strict warnings
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Iinclude \
            drivers/usb/bluetooth.c scripts/test_usb_bluetooth_descriptors.c \
            -o /tmp/test-usb-bluetooth-descriptors
      - name: Run descriptor tests
        run: /tmp/test-usb-bluetooth-descriptors
      - name: Compile parser tests with address and undefined-behavior sanitizers
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -g -Iinclude \
            drivers/usb/bluetooth.c scripts/test_usb_bluetooth_descriptors.c \
            -o /tmp/test-usb-bluetooth-descriptors-sanitized
      - name: Run sanitized parser tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: /tmp/test-usb-bluetooth-descriptors-sanitized
