name: VantaOS safe UEFI hardware test media
run-name: Build UEFI USB image and run OVMF validation (${{ github.sha }})

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "boot/uefi/loader.c"
      - "kernel/**"
      - "drivers/**"
      - "os/**"
      - "arch/**"
      - "mm/**"
      - "fs/**"
      - "include/**"
      - "Makefile"
      - "build.sh"
      - "scripts/test_uefi_image_boot.py"
      - ".github/workflows/hardware-boot-media.yml"

permissions:
  contents: read

concurrency:
  group: vantaos-hardware-boot-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install UEFI build and OVMF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential nasm grub-pc-bin xorriso \
            mtools dosfstools qemu-system-x86 gnu-efi ovmf gdisk util-linux

      - name: Build normal release kernel and UEFI test image
        run: |
          set -euo pipefail
          chmod +x build.sh
          VANTAOS_DEBUG_PORT=1 ./build.sh
          VANTAOS_DEBUG_PORT=1 make uefi
          test -s VantaOS-UEFI.img
          test -s BOOTX64.EFI
          test -s kernel-uefi.elf

      - name: Validate GPT, FAT32 ESP and required boot files
        run: |
          set -euo pipefail
          sfdisk --verify VantaOS-UEFI.img
          sfdisk --dump VantaOS-UEFI.img
          python3 - <<'PY'
          import json
          import struct
          import subprocess

          image = "VantaOS-UEFI.img"
          table = json.loads(subprocess.check_output(
              ["sfdisk", "--json", image], text=True))
          part = table["partitiontable"]["partitions"][0]
          assert table["partitiontable"]["label"] == "gpt", (
              f"expected GPT partition table, got {table['partitiontable']['label']}"
          )
          start = int(part["start"])
          size = int(part["size"])
          ptype = part["type"].lower()
          expected_esp = "c12a7328-f81f-11d2-ba4b-00a0c93ec93b"
          assert ptype == expected_esp, (
              f"expected EFI System Partition GUID {expected_esp}, got {ptype}"
          )
          with open(image, "rb") as stream:
              stream.seek(start * 512)
              boot = stream.read(512)
          bps = struct.unpack_from("<H", boot, 11)[0]
          total16 = struct.unpack_from("<H", boot, 19)[0]
          total32 = struct.unpack_from("<I", boot, 32)[0]
          total = total16 or total32
          hidden = struct.unpack_from("<I", boot, 28)[0]
          assert bps == 512, f"unexpected FAT sector size {bps}"
          assert hidden == 0, f"UEFI partition-relative FAT BPB must have hidden sectors 0, got {hidden}"
          assert 0 < total <= size, f"FAT volume sectors {total} exceed partition sectors {size}"
          assert boot[510] == 0x55 and boot[511] == 0xAA, "missing FAT boot signature"
          print(f"GPT EFI FAT32 BPB valid: start={start} sectors={total}/{size} hidden={hidden}")
          PY
          mcopy -i VantaOS-UEFI.img@@1048576 ::/EFI/BOOT/BOOTX64.EFI /tmp/BOOTX64.EFI
          mcopy -i VantaOS-UEFI.img@@1048576 ::/EFI/VANTA/KERNEL.ELF /tmp/KERNEL.ELF
          cmp BOOTX64.EFI /tmp/BOOTX64.EFI
          cmp kernel-uefi.elf /tmp/KERNEL.ELF
          test -s /tmp/BOOTX64.EFI
          test -s /tmp/KERNEL.ELF
          # EFI diagnostic strings must survive ELF-to-PE section conversion.
          # Without .rodata, the firmware can enter the image but the loader
          # reads missing string literals and never emits its startup marker.
          for marker in \
            VANTAOS_UEFI_LOADER_START \
            VANTAOS_UEFI_ELF_LOADED \
            VANTAOS_UEFI_KERNEL_FILE_OPEN_FAIL; do
            grep -aFq "$marker" BOOTX64.EFI || {
              echo "EFI application is missing required read-only data: $marker"
              exit 1
            }
          done
          sha256sum VantaOS-UEFI.img BOOTX64.EFI kernel-uefi.elf > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Validate UEFI executable and kernel ELF structure
        shell: bash
        run: |
          set -euo pipefail
          objdump -f BOOTX64.EFI
          objdump -p BOOTX64.EFI | grep -E 'Magic[[:space:]]+020b|Subsystem[[:space:]]+0000000a'
          readelf -h kernel-uefi.elf
          readelf -lW kernel-uefi.elf
          python3 - <<'PY'
          import subprocess
          import re

          header = subprocess.check_output(["readelf", "-h", "kernel-uefi.elf"], text=True)
          assert re.search(r"Class:\s+ELF64", header), "UEFI kernel is not ELF64"
          assert re.search(r"Machine:\s+Advanced Micro Devices X86-64", header), "wrong kernel architecture"
          assert re.search(r"Type:\s+EXEC", header), "UEFI kernel must be a static executable"
          segments = subprocess.check_output(["readelf", "-lW", "kernel-uefi.elf"], text=True)
          loads = [line for line in segments.splitlines() if line.lstrip().startswith("LOAD")]
          assert loads, "kernel has no PT_LOAD segments"
          assert any(" R E " in line or line.rstrip().endswith("R E") for line in loads), (
              "kernel has no executable load segment"
          )
          print(f"ELF structure valid: {len(loads)} loadable segments")
          PY

      - name: Verify GPT integrity and FAT32 contents
        shell: bash
        run: |
          set -euo pipefail
          sgdisk --verify VantaOS-UEFI.img
          sfdisk --verify VantaOS-UEFI.img
          python3 - <<'PY'
          import json
          import struct
          import subprocess

          image = "VantaOS-UEFI.img"
          table = json.loads(subprocess.check_output(
              ["sfdisk", "--json", image], text=True))["partitiontable"]
          assert table["label"] == "gpt", f"expected GPT, got {table['label']}"
          assert len(table["partitions"]) == 1, (
              f"expected one ESP partition, found {len(table['partitions'])}"
          )
          part = table["partitions"][0]
          start, size = int(part["start"]), int(part["size"])
          assert start == 2048, f"unexpected ESP start sector {start}"
          assert part["type"].lower() == "c12a7328-f81f-11d2-ba4b-00a0c93ec93b"
          image_sectors = __import__("os").path.getsize(image) // 512
          assert start + size <= image_sectors - 33, "ESP overlaps backup GPT metadata"
          with open(image, "rb") as stream:
              stream.seek(start * 512)
              boot = stream.read(512)
          bps = struct.unpack_from("<H", boot, 11)[0]
          spc = boot[13]
          reserved = struct.unpack_from("<H", boot, 14)[0]
          fats = boot[16]
          total = struct.unpack_from("<I", boot, 32)[0] or struct.unpack_from("<H", boot, 19)[0]
          fat_size = struct.unpack_from("<I", boot, 36)[0]
          hidden = struct.unpack_from("<I", boot, 28)[0]
          assert bps == 512 and spc in (1, 2, 4, 8, 16, 32, 64, 128)
          assert reserved > 0 and fats == 2 and fat_size > 0
          assert total > 0 and total <= size and hidden == 0
          assert boot[510:512] == b"\x55\xaa", "missing FAT boot signature"
          data_sectors = total - reserved - fats * fat_size
          clusters = data_sectors // spc
          assert clusters > 65525, f"volume is not FAT32 by cluster-count definition: {clusters}"
          fsinfo_sector = struct.unpack_from("<H", boot, 48)[0]
          backup_sector = struct.unpack_from("<H", boot, 50)[0]
          assert 0 < fsinfo_sector < reserved, f"invalid FSInfo sector {fsinfo_sector}"
          assert 0 < backup_sector < reserved, f"invalid backup boot sector {backup_sector}"
          with open(image, "rb") as stream:
              stream.seek(start * 512 + fsinfo_sector * 512)
              fsinfo = stream.read(512)
              stream.seek(start * 512 + backup_sector * 512)
              backup_boot = stream.read(512)
          assert struct.unpack_from("<I", fsinfo, 0)[0] == 0x41615252, "invalid FSInfo lead signature"
          assert struct.unpack_from("<I", fsinfo, 484)[0] == 0x61417272, "invalid FSInfo structure signature"
          assert struct.unpack_from("<I", fsinfo, 508)[0] == 0xAA550000, "invalid FSInfo trail signature"
          assert backup_boot[510:512] == b"\x55\xaa", "invalid backup FAT boot signature"
          assert backup_boot[:90] == boot[:90], "FAT32 backup boot sector differs from primary"
          print(f"ESP geometry valid: start={start}, sectors={total}, clusters={clusters}, cluster={spc * bps} bytes")
          PY
          mkdir -p /tmp/vanta-esp-check
          mdir -i VantaOS-UEFI.img@@1048576 ::/EFI
          mdir -i VantaOS-UEFI.img@@1048576 ::/EFI/BOOT
          mdir -i VantaOS-UEFI.img@@1048576 ::/EFI/VANTA
          mcopy -i VantaOS-UEFI.img@@1048576 ::/EFI/BOOT/BOOTX64.EFI /tmp/vanta-esp-check/BOOTX64.EFI
          mcopy -i VantaOS-UEFI.img@@1048576 ::/EFI/VANTA/KERNEL.ELF /tmp/vanta-esp-check/KERNEL.ELF
          cmp BOOTX64.EFI /tmp/vanta-esp-check/BOOTX64.EFI
          cmp kernel-uefi.elf /tmp/vanta-esp-check/KERNEL.ELF
          sha256sum BOOTX64.EFI /tmp/vanta-esp-check/BOOTX64.EFI kernel-uefi.elf /tmp/vanta-esp-check/KERNEL.ELF
          for marker in \
            VANTAOS_UEFI_LOADER_START \
            VANTAOS_UEFI_ELF_LOADED \
            VANTAOS_UEFI_KERNEL_FILE_OPEN_FAIL; do
            grep -aFq "$marker" BOOTX64.EFI || {
              echo "EFI application is missing required diagnostic data: $marker"
              exit 1
            }
          done

      - name: Strict raw-image UEFI boot, timer, xHCI and USB input matrix
        shell: bash
        run: |
          set -euo pipefail
          code_firmware=""
          vars_template=""
          for suffix in "" "_4M"; do
            code_candidate="/usr/share/OVMF/OVMF_CODE${suffix}.fd"
            vars_candidate="/usr/share/OVMF/OVMF_VARS${suffix}.fd"
            if [ -s "$code_candidate" ] && [ -s "$vars_candidate" ]; then
              code_firmware="$code_candidate"
              vars_template="$vars_candidate"
              break
            fi
          done
          if [ -z "$code_firmware" ]; then
            code_firmware="$(find /usr/share -maxdepth 4 -name 'OVMF_CODE*.fd' -print -quit)"
            vars_template="${code_firmware/OVMF_CODE/OVMF_VARS}"
          fi
          test -s "$code_firmware"
          test -s "$vars_template"
          python3 -m py_compile scripts/test_uefi_image_boot.py
          python3 scripts/test_uefi_image_boot.py "$code_firmware" "$vars_template"

      - name: Upload UEFI hardware test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VantaOS-UEFI-hardware-test-${{ github.sha }}
          path: |
            VantaOS-UEFI.img
            BOOTX64.EFI
            kernel-uefi.elf
            SHA256SUMS.txt
            uefi-hardware-test.log
            uefi-debug.log
            ovmf-debug.log
            qemu-int.log
            uefi-test-logs/**
          if-no-files-found: warn
          retention-days: 30
