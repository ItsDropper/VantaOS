name: Bug report
description: Report a reproducible VantaOS defect
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report observed behavior, not a guessed root cause. Do not include private data or credentials.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened, and what did you expect instead?
      placeholder: Describe the observable failure.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest sequence that reproduces the issue.
      placeholder: |
        1. Build with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - QEMU BIOS
        - QEMU UEFI / OVMF
        - Physical hardware
        - Build or static check only
        - Other / unknown
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and evidence
      description: Paste relevant serial output, CI links, compiler diagnostics, or screenshots. Redact sensitive information.
      render: text
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Regression context
      description: State the last known-good revision or whether the issue is newly observed, if known.
    validations:
      required: false
