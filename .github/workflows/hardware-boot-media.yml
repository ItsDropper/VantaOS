name: VantaOS safe UEFI hardware test media

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "boot/uefi/loader.c"
      - "kernel/**"
      - "drivers/**"
      - "arch/**"
      - "mm/**"
      - "fs/**"
      - "include/**"
      - "Makefile"
      - "build.sh"
      - ".github/workflows/hardware-boot-media.yml"

permissions:
  contents: read

concurrency:
  group: vantaos-hardware-boot-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install UEFI build and OVMF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential nasm grub-pc-bin xorriso \
            mtools dosfstools qemu-system-x86 gnu-efi ovmf gdisk util-linux

      - name: Build normal release kernel and UEFI test image
        run: |
          set -euo pipefail
          chmod +x build.sh
          VANTAOS_DEBUG_PORT=1 ./build.sh
          VANTAOS_DEBUG_PORT=1 make uefi
          test -s VantaOS-UEFI.img
          test -s BOOTX64.EFI
          test -s kernel-uefi.elf

      - name: Validate GPT, FAT32 ESP and required boot files
        run: |
          set -euo pipefail
          sfdisk --verify VantaOS-UEFI.img
          sfdisk --dump VantaOS-UEFI.img
          python3 - <<'PY'
          import json
          import struct
          import subprocess

          image = "VantaOS-UEFI.img"
          table = json.loads(subprocess.check_output(
              ["sfdisk", "--json", image], text=True))
          part = table["partitiontable"]["partitions"][0]
          assert table["partitiontable"]["label"] == "gpt", (
              f"expected GPT partition table, got {table['partitiontable']['label']}"
          )
          start = int(part["start"])
          size = int(part["size"])
          ptype = part["type"].lower()
          expected_esp = "c12a7328-f81f-11d2-ba4b-00a0c93ec93b"
          assert ptype == expected_esp, (
              f"expected EFI System Partition GUID {expected_esp}, got {ptype}"
          )
          with open(image, "rb") as stream:
              stream.seek(start * 512)
              boot = stream.read(512)
          bps = struct.unpack_from("<H", boot, 11)[0]
          total16 = struct.unpack_from("<H", boot, 19)[0]
          total32 = struct.unpack_from("<I", boot, 32)[0]
          total = total16 or total32
          hidden = struct.unpack_from("<I", boot, 28)[0]
          assert bps == 512, f"unexpected FAT sector size {bps}"
          assert hidden == 0, f"UEFI partition-relative FAT BPB must have hidden sectors 0, got {hidden}"
          assert 0 < total <= size, f"FAT volume sectors {total} exceed partition sectors {size}"
          assert boot[510] == 0x55 and boot[511] == 0xAA, "missing FAT boot signature"
          print(f"GPT EFI FAT32 BPB valid: start={start} sectors={total}/{size} hidden={hidden}")
          PY
          mcopy -i VantaOS-UEFI.img@@1048576 ::/EFI/BOOT/BOOTX64.EFI /tmp/BOOTX64.EFI
          mcopy -i VantaOS-UEFI.img@@1048576 ::/EFI/VANTA/KERNEL.ELF /tmp/KERNEL.ELF
          cmp BOOTX64.EFI /tmp/BOOTX64.EFI
          cmp kernel-uefi.elf /tmp/KERNEL.ELF
          test -s /tmp/BOOTX64.EFI
          test -s /tmp/KERNEL.ELF
          # EFI diagnostic strings must survive ELF-to-PE section conversion.
          # Without .rodata, the firmware can enter the image but the loader
          # reads missing string literals and never emits its startup marker.
          for marker in \
            VANTAOS_UEFI_LOADER_START \
            VANTAOS_UEFI_ELF_LOADED \
            VANTAOS_UEFI_KERNEL_FILE_OPEN_FAIL; do
            grep -aFq "$marker" BOOTX64.EFI || {
              echo "EFI application is missing required read-only data: $marker"
              exit 1
            }
          done
          sha256sum VantaOS-UEFI.img BOOTX64.EFI kernel-uefi.elf > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Boot UEFI test media in OVMF without a secondary disk attached
        shell: bash
        run: |
          set -euo pipefail
          code_firmware=""
          vars_template=""
          for suffix in "" "_4M"; do
            code_candidate="/usr/share/OVMF/OVMF_CODE${suffix}.fd"
            vars_candidate="/usr/share/OVMF/OVMF_VARS${suffix}.fd"
            if [ -s "$code_candidate" ] && [ -s "$vars_candidate" ]; then
              code_firmware="$code_candidate"
              vars_template="$vars_candidate"
              break
            fi
          done
          if [ -z "$code_firmware" ]; then
            code_firmware="$(find /usr/share -maxdepth 4 -name 'OVMF_CODE*.fd' -print -quit)"
            vars_template="${code_firmware/OVMF_CODE/OVMF_VARS}"
          fi
          test -s "$code_firmware"
          test -s "$vars_template"
          cp "$vars_template" OVMF_VARS.fd
          # Boot the exact loader and kernel payload through an El Torito
          # EFI boot image. The raw GPT/FAT32 USB image is validated above;
          # OVMF on hosted runners does not reliably enumerate its raw-disk
          # fallback path, so this isolates loader and kernel handoff testing.
          mkdir -p uefi-iso-root/EFI/BOOT uefi-iso-root/EFI/VANTA
          truncate -s 64M uefi-boot-esp.img
          mkfs.fat -F 32 uefi-boot-esp.img >/dev/null
          mmd -i uefi-boot-esp.img ::/EFI
          mmd -i uefi-boot-esp.img ::/EFI/BOOT
          mmd -i uefi-boot-esp.img ::/EFI/VANTA
          mcopy -i uefi-boot-esp.img BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI
          mcopy -i uefi-boot-esp.img kernel-uefi.elf ::/EFI/VANTA/KERNEL.ELF
          cp uefi-boot-esp.img uefi-iso-root/efiboot.img
          # Mirror the EFI tree into the ISO filesystem for tools that inspect
          # ISO9660/Joliet paths instead of the El Torito EFI System Partition.
          cp BOOTX64.EFI uefi-iso-root/EFI/BOOT/BOOTX64.EFI
          cp kernel-uefi.elf uefi-iso-root/EFI/VANTA/KERNEL.ELF
          xorriso -as mkisofs -R -J -V VANTAOSUEFI \
            -eltorito-alt-boot -e efiboot.img -no-emul-boot \
            -o uefi-smoke.iso uefi-iso-root

          set +e
          timeout 25s qemu-system-x86_64 \
            -machine pc -cpu max -m 512M -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file="$code_firmware" \
            -drive if=pflash,format=raw,file=OVMF_VARS.fd \
            -drive if=ide,index=0,media=cdrom,format=raw,file=uefi-smoke.iso \
            -boot order=d \
            -display none -serial file:uefi-hardware-test.log \
            -chardev file,id=ovmfdebug,path=ovmf-debug.log \
            -device isa-debugcon,iobase=0x402,chardev=ovmfdebug \
            -chardev file,id=vantadebug,path=uefi-debug.log \
            -device isa-debugcon,iobase=0xe9,chardev=vantadebug \
            -monitor none -no-reboot
          result=$?
          set -e
          if [ "$result" -ne 124 ]; then
            echo "OVMF test did not remain in the kernel smoke test (exit $result)."
            cat uefi-hardware-test.log 2>/dev/null || true
            exit 1
          fi
          sleep 1
          if grep -Eq '^VANTAOS_[A-Z0-9_]*_FAIL' uefi-debug.log; then
            echo "UEFI test boot emitted a failure marker."
            cat uefi-debug.log
            exit 1
          fi
          for marker in \
            VANTAOS_UEFI_LOADER_START \
            VANTAOS_UEFI_ELF_LOADED \
            VANTAOS_UEFI_STORAGE_POLICY_READ_ONLY \
            VANTAOS_UEFI_EXIT_BOOT_SERVICES_OK \
            VANTAOS_UEFI_KERNEL_HANDOFF \
            VANTAOS_UEFI_KERNEL_ENTRY \
            VANTAOS_UEFI_BOOT_INFO_READY \
            VANTAOS_BOOT_OK; do
            grep -q "$marker" uefi-debug.log || {
              echo "Missing required marker: $marker"
              cat uefi-debug.log
              cat ovmf-debug.log 2>/dev/null || true
              cat uefi-hardware-test.log 2>/dev/null || true
              exit 1
            }
          done
          echo "UEFI live-media smoke test passed with no secondary disk attached; the kernel read-only policy is asserted by the block-device host test."

      - name: Upload UEFI hardware test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VantaOS-UEFI-hardware-test-${{ github.sha }}
          path: |
            VantaOS-UEFI.img
            BOOTX64.EFI
            kernel-uefi.elf
            uefi-boot-esp.img
            uefi-smoke.iso
            SHA256SUMS.txt
            uefi-hardware-test.log
            uefi-debug.log
            ovmf-debug.log
          if-no-files-found: warn
          retention-days: 30
